config:
  validation: true
  warningsAsErrors: true

comments:
  active: false

complexity:
  severity: warning
  ComplexCondition:
    severity: error
  CyclomaticComplexMethod:
    allowedComplexity: 24
  LongParameterList:
    active: false
  LongMethod:
    active: false
  NestedBlockDepth:
    severity: error
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 20
    ignoreAnnotatedFunctions:
      - 'Binds'
      - 'Preview'
      - 'Provides'

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    excludes:
      - '**/coroutines/DispatcherProviderImpl.kt'
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

exceptions:
  TooGenericExceptionThrown:
    severity: warning
  ErrorUsageWithThrowable:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true

potential-bugs:
  Deprecation:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  MissingSuperCall:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  DontDowncastCollectionTypes:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

performance:
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTypeCasting:
    active: true

style:
  CollapsibleIfStatements:
    active: true
  DataClassShouldBeImmutable:
    active: true
  DoubleNegativeExpression:
    active: true
  ExpressionBodySyntax:
    active: true
  RedundantExplicitType:
    active: true
  RedundantVisibilityModifier:
    active: true
  UnnecessaryAny:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryReversed:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'android.util.Log'
        reason: 'Log with Logger from core.common.logger (AGENTS.md > Conventions).'
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'Never block a thread; use coroutines (AGENTS.md > Non-Negotiables).'
      - value: 'java.util.concurrent.Executor*'
        reason: 'Use coroutines, never an Executor (AGENTS.md > Non-Negotiables).'
      - value: 'androidx.compose.runtime.collectAsState'
        reason: 'Collect state with collectAsStateWithLifecycle() (AGENTS.md > Architecture > ViewModels).'
    excludes:
      - '**/logger/Logger.kt'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.print'
        reason: 'Log with Logger from core.common.logger (AGENTS.md > Conventions).'
      - value: 'kotlin.io.println'
        reason: 'Log with Logger from core.common.logger (AGENTS.md > Conventions).'
      - value: 'java.lang.Thread.<init>'
        reason: 'Use coroutines, never a Thread (AGENTS.md > Non-Negotiables).'
      - value: 'kotlin.concurrent.thread'
        reason: 'Use coroutines, never a Thread (AGENTS.md > Non-Negotiables).'
      - value: 'java.lang.Thread.sleep'
        reason: 'Use delay() in a coroutine (AGENTS.md > Non-Negotiables).'
  ForbiddenSuppress:
    active: true
    rules:
      - 'NoComments'
      - 'AppFunctionKDocRequired'
      - 'NoKtlintSuppression'
      - 'ViewModelContract'
      - 'ContractTypeShape'
      - 'MutableFlowExposure'
      - 'EntryBlockDelegatesToScreen'
      - 'NavKeyShape'
      - 'ApiModuleContents'
      - 'ImplVisibility'
      - 'SingletonRepositoryBinding'
      - 'SealedMemberDataObject'
      - 'PreviewShape'
      - 'PreviewPresence'
      - 'NoRawColor'
      - 'HardcodedComposeString'
      - 'ForbiddenImport'
      - 'ForbiddenMethodCall'
      - 'UnusedImport'
      - 'InjectDispatcher'
      - 'GlobalCoroutineUsage'
      - 'SuspendFunSwallowedCancellation'
      - 'ElseCaseInsteadOfExhaustiveWhen'
      - 'DataClassShouldBeImmutable'
  UnusedImport:
    active: true
  MagicNumber:
    active: false
    severity: info
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    severity: warning
    max: 7
  ThrowsCount:
    severity: warning
  UnusedPrivateFunction:
    allowedNames: '.*Preview'
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: true
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

apkanalyzer:
  AppFunctionKDocRequired:
    includes:
      - '**/core/app-functions/src/main/**'
  ContractTypeShape:
    includes:
      - '**/feature/*/phone/src/main/**'
      - '**/feature/*/tv/src/main/**'
      - '**/app/src/main/**'
      - '**/tv/src/main/**'
  ApiModuleContents:
    includes:
      - '**/feature/*/api/src/main/**'
  PreviewPresence:
    excludes:
      - '**/theme/**'
      - '**/navigation/**'
      - '**/ApkAnalyzerApp.kt'
      - '**/TvApkAnalyzerApp.kt'
      - '**/core/design-system/foundation/**'
  NoRawColor:
    excludes:
      - '**/core/design-system/**'
  HardcodedComposeString:
    includes:
      - '**/feature/*/phone/src/main/**'
      - '**/feature/*/tv/src/main/**'
      - '**/app/src/main/**'
      - '**/tv/src/main/**'
