name: Promote release to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being promoted (e.g. 3.5.0)'
        required: true
      form-factor:
        description: 'Which app to promote'
        type: choice
        required: true
        default: phone
        options:
          - phone
          - tv
          - both
      rollout-percentage:
        description: 'Percentage of production users to receive the update (1-100)'
        required: false
        default: '100'

run-name: Promote ${{ inputs.version }} (${{ inputs.form-factor }}) to production (${{ inputs.rollout-percentage }}%)

permissions:
  contents: read

jobs:
  promote-phone:
    name: Promote phone
    if: ${{ inputs.form-factor == 'phone' || inputs.form-factor == 'both' }}
    uses: ./.github/workflows/promote-app-release.yml
    with:
      version: ${{ inputs.version }}
      form-factor: phone
      module: app
      testing-track: beta
      production-track: production
      rollout-percentage: ${{ inputs.rollout-percentage }}
    secrets:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

  promote-tv:
    name: Promote TV
    needs: [ promote-phone ]
    if: ${{ !cancelled() && (inputs.form-factor == 'tv' || inputs.form-factor == 'both') }}
    uses: ./.github/workflows/promote-app-release.yml
    with:
      version: ${{ inputs.version }}
      form-factor: tv
      module: tv
      testing-track: 'tv:Beta TV'
      production-track: 'tv:production'
      rollout-percentage: ${{ inputs.rollout-percentage }}
    secrets:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
