name: Promote release to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being promoted (e.g. 3.5.0)'
        required: true
      rollout-percentage:
        description: 'Percentage of production users to receive the update (1-100)'
        required: false
        default: '100'

run-name: Promote ${{ inputs.version }} to production (${{ inputs.rollout-percentage }}%)

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/androidpublisher'

      - name: Determine promotion source track
        id: source
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION: ${{ inputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          TARGET_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version-code=$TARGET_VERSION_CODE" >> "$GITHUB_OUTPUT"

          BASE="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/sk.styk.martin.apkanalyzer"

          TRACK_BODY_FILE=$(mktemp)
          cleanup() {
            if [ -n "${EDIT_ID:-}" ]; then
              curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/edits/$EDIT_ID:delete" > /dev/null || true
            fi
            rm -f "$TRACK_BODY_FILE"
          }
          trap cleanup EXIT

          EDIT_RESPONSE=$(curl -sSf -X POST -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/edits")
          EDIT_ID=$(echo "$EDIT_RESPONSE" | jq -r ".id // empty")
          if [ -z "$EDIT_ID" ]; then
            echo "::error::Failed to create Google Play edit."
            echo "::error::Response: $EDIT_RESPONSE"
            exit 1
          fi

          TRACK_STATUS=$(curl -sS -o "$TRACK_BODY_FILE" -w "%{http_code}" -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/edits/$EDIT_ID/tracks/production")

          if [ "$TRACK_STATUS" -eq 404 ]; then
            PROD_VERSION_CODE=""
            PROD_RELEASE_STATUS=""
          elif [ "$TRACK_STATUS" -eq 200 ]; then
            PROD_RELEASE=$(jq -c '[(.releases // [])[] | select(.status == "inProgress" or .status == "halted")][0] // empty' "$TRACK_BODY_FILE")
            PROD_VERSION_CODE=$(echo "$PROD_RELEASE" | jq -r '.versionCodes[0] // empty')
            PROD_RELEASE_STATUS=$(echo "$PROD_RELEASE" | jq -r '.status // empty')
          else
            echo "::error::Failed to read production track. HTTP status: $TRACK_STATUS"
            echo "::error::Response: $(cat "$TRACK_BODY_FILE")"
            exit 1
          fi

          if [ -n "$PROD_VERSION_CODE" ] && [ "$PROD_VERSION_CODE" = "$TARGET_VERSION_CODE" ]; then
            if [ "$PROD_RELEASE_STATUS" = "halted" ]; then
              echo "::error::Production release (version code $PROD_VERSION_CODE) is halted."
              echo "::error::A halted rollout is usually paused deliberately (crashes, bad reviews)."
              echo "::error::Resume it manually in Play Console, or promote fresh from beta if superseded."
              exit 1
            fi
            echo "Production's in-progress release (version code $PROD_VERSION_CODE) matches the target; adjusting its rollout percentage."
            echo "from-track=production" >> "$GITHUB_OUTPUT"
          else
            echo "Promoting version code $TARGET_VERSION_CODE fresh from beta."
            echo "from-track=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote Play Store release to production
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          FROM_TRACK: ${{ steps.source.outputs.from-track }}
          VERSION_CODE: ${{ steps.source.outputs.version-code }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout-percentage }}
        run: |
          if ! [[ "$ROLLOUT_PERCENTAGE" =~ ^[0-9]+$ ]] || [ "$ROLLOUT_PERCENTAGE" -lt 1 ] || [ "$ROLLOUT_PERCENTAGE" -gt 100 ]; then
            echo "::error::rollout-percentage must be a whole number between 1 and 100, got '$ROLLOUT_PERCENTAGE'"
            exit 1
          fi

          if [ "$FROM_TRACK" = "production" ]; then
            TRACK_ARGS=(--update production)
          else
            TRACK_ARGS=(--from-track "$FROM_TRACK" --promote-track production)
          fi

          if [ "$ROLLOUT_PERCENTAGE" -eq 100 ]; then
            ./gradlew :app:promoteArtifact "${TRACK_ARGS[@]}" --version-code "$VERSION_CODE" --release-status completed
          else
            USER_FRACTION=$(awk "BEGIN { printf \"%.2f\", $ROLLOUT_PERCENTAGE / 100 }")
            ./gradlew :app:promoteArtifact "${TRACK_ARGS[@]}" --version-code "$VERSION_CODE" --release-status inProgress --user-fraction "$USER_FRACTION"
          fi
