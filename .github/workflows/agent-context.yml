name: Agent context

on:
  push:
    branches: [ develop ]
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.github/copilot-instructions.md'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/workflows/agent-context.yml'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ develop ]
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.github/copilot-instructions.md'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/workflows/agent-context.yml'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'

concurrency:
  group: agent-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate agent context
        run: ./gradlew validateAgentContext
