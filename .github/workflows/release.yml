name: Release

on:
  push:
    tags:
      - '+([0-9]).+([0-9]).+([0-9])'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch Firebase google-services.json
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          rm -f app/google-services.json
          .github/scripts/run-firebase.sh apps:sdkconfig ANDROID "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            -o app/google-services.json

      - name: Verify release
        run: |
          ./gradlew spotlessCheck detektDebug :build-logic:convention:detektMain lintRelease --continue

  build-release:
    runs-on: ubuntu-latest
    outputs:
      apk_name: apk-analyzer-${{ github.ref_name }}.apk
      aab_name: apk-analyzer-${{ github.ref_name }}.aab

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch Firebase google-services.json
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          rm -f app/google-services.json
          .github/scripts/run-firebase.sh apps:sdkconfig ANDROID "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            -o app/google-services.json

      - name: Compute versionCode from tag
        id: version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$GITHUB_REF_NAME"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build release AAB and APK
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pversion.code=${{ steps.version.outputs.code }} \
            -Pversion.name="$GITHUB_REF_NAME"

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGN_KEY }}
          alias: ${{ secrets.SIGN_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGN_KEY }}
          alias: ${{ secrets.SIGN_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Rename signed artifacts
        run: |
          mv "${{ steps.sign_aab.outputs.signedReleaseFile }}" "app/build/outputs/bundle/release/apk-analyzer-${{ github.ref_name }}.aab"
          mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" "app/build/outputs/apk/release/apk-analyzer-${{ github.ref_name }}.apk"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-analyzer-aab
          path: app/build/outputs/bundle/release/apk-analyzer-${{ github.ref_name }}.aab
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-analyzer-apk
          path: app/build/outputs/apk/release/apk-analyzer-${{ github.ref_name }}.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload mapping file artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-analyzer-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish-github-release:
    needs: [ verify, build-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-analyzer-apk
          path: artifacts

      - name: Read tag annotation as release notes
        id: notes
        run: |
          {
            echo "body<<NOTES_EOF"
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/${{ needs['build-release'].outputs.apk_name }}

  publish-play-store:
    needs: [ verify, build-release ]
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-analyzer-aab
          path: artifacts

      - name: Download mapping file artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-analyzer-mapping
          path: artifacts

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1.0.19
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: sk.styk.martin.apkanalyzer
          releaseFiles: artifacts/${{ needs['build-release'].outputs.aab_name }}
          mappingFile: artifacts/mapping.txt
          track: beta
          status: completed

  distribute-app-distribution:
    needs: [ verify, build-release ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-analyzer-apk
          path: artifacts

      - name: Distribute APK to Firebase App Distribution
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          .github/scripts/run-firebase.sh appdistribution:distribute "artifacts/${{ needs['build-release'].outputs.apk_name }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "internal-testers" \
            --release-notes "${{ github.ref_name }}"
