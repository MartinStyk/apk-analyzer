name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

run-name: Release ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read tag annotation as release notes
        id: notes
        run: |
          BODY=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          if [ -z "$BODY" ]; then
            echo "::error::Tag $GITHUB_REF_NAME has no annotation message, so it can't provide release notes. Push an annotated tag instead: git tag -a $GITHUB_REF_NAME -m \"release notes\" && git push origin $GITHUB_REF_NAME"
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: [ check-tag ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Fetch Firebase google-services.json
        uses: ./.github/actions/fetch-google-services
        with:
          firebase-token: ${{ secrets.FIREBASE_TOKEN }}
          firebase-app-id: ${{ secrets.FIREBASE_APP_ID }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify release
        run: |
          ./gradlew spotlessCheck detektDebug :build-logic:convention:detektMain lintRelease --continue

  build-release:
    needs: [ check-tag ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - form-factor: phone
            module: app
            artifact: apk-analyzer
          - form-factor: tv
            module: tv
            artifact: apk-analyzer-tv

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Fetch Firebase google-services.json
        uses: ./.github/actions/fetch-google-services
        with:
          firebase-token: ${{ secrets.FIREBASE_TOKEN }}
          firebase-app-id: ${{ secrets.FIREBASE_APP_ID }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Compute versionCode from tag
        id: version
        run: |
          CODE=$(bash .github/scripts/version-code.sh "$GITHUB_REF_NAME" "${{ matrix.form-factor }}")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        uses: ./.github/actions/setup-release-signing
        with:
          sign-key: ${{ secrets.SIGN_KEY }}
          sign-key-alias: ${{ secrets.SIGN_KEY_ALIAS }}
          sign-key-store-password: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          sign-key-password: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Build and sign release AAB and APK
        run: |
          ./gradlew :${{ matrix.module }}:bundleRelease :${{ matrix.module }}:assembleRelease \
            -Pversion.code=${{ steps.version.outputs.code }} \
            -Pversion.name="$GITHUB_REF_NAME"

      - name: Rename release artifacts
        run: |
          mv ${{ matrix.module }}/build/outputs/bundle/release/*.aab "${{ matrix.module }}/build/outputs/bundle/release/${{ matrix.artifact }}-${{ github.ref_name }}.aab"
          mv ${{ matrix.module }}/build/outputs/apk/release/*.apk "${{ matrix.module }}/build/outputs/apk/release/${{ matrix.artifact }}-${{ github.ref_name }}.apk"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-aab
          path: ${{ matrix.module }}/build/outputs/bundle/release/${{ matrix.artifact }}-${{ github.ref_name }}.aab
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-apk
          path: ${{ matrix.module }}/build/outputs/apk/release/${{ matrix.artifact }}-${{ github.ref_name }}.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload mapping file artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-mapping
          path: ${{ matrix.module }}/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish-github-release:
    needs: [ check-tag, verify, build-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-apk'
          merge-multiple: true
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.check-tag.outputs.notes }}
          files: |
            artifacts/apk-analyzer-${{ github.ref_name }}.apk
            artifacts/apk-analyzer-tv-${{ github.ref_name }}.apk

  publish-play-store:
    needs: [ verify, build-release ]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - module: app
            artifact: apk-analyzer
            track: beta
          - module: tv
            artifact: apk-analyzer-tv
            track: 'tv:Beta TV'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}-aab
          path: artifacts

      - name: Publish to Play Store ${{ matrix.track }} track
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          TRACK: ${{ matrix.track }}
        run: ./gradlew :${{ matrix.module }}:publishBundle --artifact-dir artifacts --track "$TRACK"

  distribute-app-distribution:
    needs: [ verify, build-release ]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-analyzer-apk
          path: artifacts

      - name: Distribute APK to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          npx --yes firebase-tools@15.26.0 appdistribution:distribute "artifacts/apk-analyzer-${{ github.ref_name }}.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "internal-testers" \
            --release-notes "${{ github.ref_name }}"
