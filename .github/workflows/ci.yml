name: Continuous integration

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch Firebase google-services.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          rm -f app/google-services.json
          npx --yes firebase-tools@15.26.0 apps:sdkconfig ANDROID "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            -o app/google-services.json

      - name: Verify project
        run: |
          ./gradlew spotlessCheck detektDebug :build-logic:convention:detektMain lintDebug --continue

      - name: Merge SARIF reports
        if: always()
        run: ./gradlew mergeSarifReports

      - name: Upload SARIF reports
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/merged.sarif

  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch Firebase google-services.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          rm -f app/google-services.json
          npx --yes firebase-tools@15.26.0 apps:sdkconfig ANDROID "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            -o app/google-services.json

      - name: Build debug APK
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION_NAME="pr${{ github.event.pull_request.number }}.$GITHUB_RUN_NUMBER"
          else
            VERSION_NAME="dev.$GITHUB_RUN_NUMBER"
          fi
          ./gradlew :app:assembleDebug -Pversion.name="$VERSION_NAME"

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/apk-analyzer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-analyzer
          path: app/build/outputs/apk/debug/apk-analyzer.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  distribute:
    needs: [ verify, build-apk ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-analyzer
          path: artifacts

      - name: Write Firebase release notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cat > release-notes.txt <<NOTES
          $COMMIT_MESSAGE

          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTES

      - name: Distribute APK to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          npx --yes firebase-tools@15.26.0 appdistribution:distribute artifacts/apk-analyzer.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "internal-testers" \
            --release-notes-file release-notes.txt
